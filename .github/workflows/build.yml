# CI: verify tests and build cross-platform release binaries.
#
# Tag policy (locked): version tags ONLY (vX.Y.Z) — main/dev pushes
# build nothing.
#   - git tag vX.Y.Z -> run Go tests/vet, build 4 platform binaries,
#                      generate SHA256SUMS, publish GitHub Release, and
#                      update flake.nix on the default branch.
name: build
"on":
  push:
    tags: ["v[0-9]*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
          elif [[ "${ACT:-}" == "true" ]]; then
            echo "act: non-tag ref ($GITHUB_REF), simulating version v0.0.0"
            echo "tag=v0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "ref must be strict semver vX.Y.Z, got $ref"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and Test
        run: |
          go vet ./...
          go test -count=1 ./...

  bins:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build script-translator ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o script-translator-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/script-translator
      - name: Check artifact runtime
        id: artifact
        run: |
          if [[ "${ACT:-}" == "true" && -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "act: --artifact-server-path not set; skipping upload-artifact"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        with:
          name: script-translator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: script-translator-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [verify, bins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check artifact runtime
        id: artifact
        run: |
          if [[ "${ACT:-}" == "true" && -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "act: --artifact-server-path not set; skipping release verification"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        with:
          pattern: script-translator-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        run: |
          cd dist
          sha256sum script-translator-* > SHA256SUMS
      - name: Asset pre-check
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        run: |
          for f in \
            script-translator-linux-amd64 \
            script-translator-linux-arm64 \
            script-translator-darwin-arm64 \
            script-translator-windows-amd64.exe; do
            test -f "dist/$f" || { echo "missing asset: $f"; exit 1; }
          done
          test -f dist/SHA256SUMS || { echo "missing asset: SHA256SUMS"; exit 1; }
      - uses: ncipollo/release-action@v1
        if: ${{ !env.ACT && steps.artifact.outputs.enabled == 'true' }}
        with:
          tag: ${{ needs.verify.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "dist/script-translator-*,dist/SHA256SUMS"
          token: ${{ secrets.GITHUB_TOKEN }}

  update-flake:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check artifact runtime
        id: artifact
        run: |
          if [[ "${ACT:-}" == "true" && -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "act: --artifact-server-path not set; skipping flake update check"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ !env.ACT && steps.artifact.outputs.enabled == 'true' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ env.ACT && steps.artifact.outputs.enabled == 'true' }}
      - uses: actions/download-artifact@v4
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        with:
          pattern: script-translator-*
          path: dist
          merge-multiple: true
      - name: Update flake.nix
        if: ${{ steps.artifact.outputs.enabled == 'true' }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bash ./scripts/update-flake.sh "$VERSION" dist
          rm -rf dist
      - name: Commit and push flake.nix
        if: ${{ !env.ACT && steps.artifact.outputs.enabled == 'true' }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if git diff --quiet flake.nix; then
            echo "flake.nix already up to date for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore(nix): update flake.nix to ${VERSION}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
