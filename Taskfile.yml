version: '3'

dotenv: ['.env']

env:
  VERSION: v0.2.0

vars:
  BIN: ./bin/script-translator
  SCRIPT: e2e/data/e2e_scene_ver1.txt
  SCRIPT_VER2: e2e/data/e2e_scene_ver2.txt
  SEED_DICT: e2e/data/seed_entities.json
  DICT: e2e/entity/entity_dict.json
  EXTRACTED: e2e/recognize/extracted.json
  RECOGNIZED: e2e/recognize/recognized.json
  TRANSLATED_JSON: e2e/translate/translated.json
  TRANSLATED: e2e/translate/translated.txt
  TRANSLATED_VER2: e2e/translate/translated_ver2.txt
  TRANSLATED_RUN_VER1: e2e/translate/translated_run_ver1.txt
  TRANSLATED_RUN_VER2: e2e/translate/translated_run_ver2.txt
  TRANSLATED_PIPE: e2e/translate/translated_pipe.txt
  CACHE_DIR: cache

tasks:
  build:
    desc: Build the script-translator CLI binary
    cmds:
      - mkdir -p bin
      - go build -ldflags "-X main.version=${VERSION:-dev}" -o {{.BIN}} ./cmd/script-translator

  test:
    desc: Run unit and fixture-backed E2E tests plus go vet
    cmds:
      - go test -count=1 ./...
      - go vet ./...

  e2e:
    desc: Run E2E tests using recorded fixtures and local httptest server
    cmds:
      - go test -v -count=1 ./e2e

  e2e:live:
    desc: Run E2E tests against the real API configured in .env and e2e/*/config.json
    cmds:
      - go test -v -count=1 ./e2e -live

  e2e:record:
    desc: Call the real API and record raw JSON responses into e2e/fixtures/
    cmds:
      - go test -v -count=1 ./e2e -live -record

  e2e:entity:reset:
    desc: Reset e2e/entity/entity_dict.json from seed_entities.json
    cmds:
      - cp {{.SEED_DICT}} {{.DICT}}

  e2e:entity:list:
    desc: List entities in e2e/entity/entity_dict.json
    deps: [build]
    cmds:
      - '{{.BIN}} entity list -d {{.DICT}}'

  e2e:entity:insert:
    desc: Insert recognized entities into e2e/entity/entity_dict.json
    deps: [build]
    cmds:
      - '{{.BIN}} entity insert -d {{.DICT}} -i {{.RECOGNIZED}}'
      - '{{.BIN}} entity list -d {{.DICT}}'

  e2e:hashsum:
    desc: Print and compare transcript hashsums for ver1 and ver2 scripts
    deps: [build]
    cmds:
      - '{{.BIN}} script hashsum {{.SCRIPT}}'
      - '{{.BIN}} script hashsum {{.SCRIPT_VER2}}'

  e2e:extract:
    desc: Extract dialogue, skeleton, and hashsum to intermediate JSON
    deps: [build]
    cmds:
      - '{{.BIN}} script extract -i {{.SCRIPT}} -o {{.EXTRACTED}}'

  e2e:recognize:
    desc: Run entity recognition stage against live API and save raw response + recognized.json
    deps: [build]
    cmds:
      - '{{.BIN}} script recognize -c e2e/recognize/config.json -i {{.SCRIPT}} -d {{.DICT}} -o {{.RECOGNIZED}} --save-raw e2e/recognize/raw'

  e2e:translate:
    desc: Run translation stage against live API from recognized.json and save translated.json + raw responses
    deps: [build]
    cmds:
      - '{{.BIN}} script translate -c e2e/translate/config.json -i {{.SCRIPT}} -d {{.DICT}} -e {{.RECOGNIZED}} -o {{.TRANSLATED_JSON}} --save-raw e2e/translate/raw'

  e2e:assemble:
    desc: Assemble translated.json back into ver1 and ver2 script formats without calling LLM
    deps: [build]
    cmds:
      - '{{.BIN}} script assemble -i {{.SCRIPT}} -t {{.TRANSLATED_JSON}} -d {{.DICT}} -e {{.RECOGNIZED}} -o {{.TRANSLATED}}'
      - '{{.BIN}} script assemble -i {{.SCRIPT_VER2}} -t {{.TRANSLATED_JSON}} -d {{.DICT}} -e {{.RECOGNIZED}} -o {{.TRANSLATED_VER2}}'

  e2e:run:
    desc: Run full cached flow on ver1 (populates cache) then ver2 (cache hit skips LLM)
    deps: [build]
    cmds:
      - '{{.BIN}} script run -c e2e/translate/config.json -i {{.SCRIPT}} -d {{.DICT}} -o {{.TRANSLATED_RUN_VER1}} --cache-dir {{.CACHE_DIR}}'
      - '{{.BIN}} script run -c e2e/translate/config.json -i {{.SCRIPT_VER2}} -d {{.DICT}} -o {{.TRANSLATED_RUN_VER2}} --cache-dir {{.CACHE_DIR}}'

  e2e:pipe:
    desc: Run full script flow via Unix pipe against live API (recognize | translate | assemble)
    deps: [build]
    cmds:
      - '{{.BIN}} script recognize -c e2e/recognize/config.json -i {{.SCRIPT}} -d {{.DICT}} | {{.BIN}} script translate -c e2e/translate/config.json -d {{.DICT}} -e - | {{.BIN}} script assemble -i {{.SCRIPT}} -t - -d {{.DICT}} -o {{.TRANSLATED_PIPE}}'

  e2e:clean:
    desc: Remove generated E2E artifacts, cache, logs, metrics, and raw dumps
    cmds:
      - rm -rf e2e/recognize/raw e2e/translate/raw {{.CACHE_DIR}}
      - rm -f {{.EXTRACTED}} {{.RECOGNIZED}} e2e/recognize/*.jsonl
      - rm -f {{.TRANSLATED_JSON}} {{.TRANSLATED}} {{.TRANSLATED_VER2}} {{.TRANSLATED_RUN_VER1}} {{.TRANSLATED_RUN_VER2}} {{.TRANSLATED_PIPE}} e2e/translate/*.jsonl
      - rm -f {{.DICT}}

  clean:
    desc: Remove built binaries and generated E2E artifacts
    deps: [e2e:clean]
    cmds:
      - rm -rf bin
